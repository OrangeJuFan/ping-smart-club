apiVersion: v1
kind: Secret
metadata:
  name: ping-smart-club-secret
  namespace: default
type: Opaque
stringData:
  # 示例占位符：生产环境请通过 CI/CD、SealedSecret 或云厂商 Secret 管理注入真实值。
  db.user: "${DB_USER}"
  db.password: "${DB_PASSWORD}"
  redis.password: "${REDIS_PASSWORD}"
  rabbitmq.user: "${RABBITMQ_USER}"
  rabbitmq.password: "${RABBITMQ_PASSWORD}"
